name: Lowest supported PHP

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  serialization-regression:
    name: Serialization regression (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run serialization regression tests
        run: vendor/bin/phpunit --do-not-cache-result tests/BasicFieldSerializationTest.php
